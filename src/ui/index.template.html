(function () { try { var u = JSON.parse(localStorage.getItem('spotter.ui') || '{}'), m = u.mode || 'dark'; if (m === 'auto') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; var d = document.documentElement; d.setAttribute('data-pal', u.pal || 'spotter'); d.setAttribute('data-theme', m); } catch (e) {} })();
</script>
